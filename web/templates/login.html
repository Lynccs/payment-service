<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Вхід — Finio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/static/css/auth.css" rel="stylesheet"/>
</head>
<body class="auth-bg d-flex align-items-center justify-content-center min-vh-100">

  <div class="d-flex flex-column align-items-center w-100">
    <div class="text-center mb-3">
      <div class="auth-logo-pill mx-auto mb-2">
        <i class="bi bi-wallet2"></i>
        <span>Finio</span>
      </div>
      <div class="text-white small">Твої фінанси під контролем</div>
    </div>

    <div class="card auth-card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">Вхід</h4>

      <div id="alert" class="alert d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <div class="field-wrapper">
            <input type="email" class="form-control" id="email" placeholder="you@example.com"/>
            <span class="field-icon bi" id="emailIcon"></span>
          </div>
          <div class="invalid-feedback" id="emailFeedback">Введіть email</div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Пароль</label>
          <div class="field-wrapper">
            <input type="password" class="form-control" id="password" placeholder="Ваш пароль"/>
            <button type="button" class="field-icon clickable" id="passwordBtn" tabindex="-1">
              <i class="bi" id="passwordIcon"></i>
            </button>
          </div>
          <div class="invalid-feedback" id="passwordFeedback">Введіть пароль</div>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="submitBtn">
          Увійти
        </button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Немає акаунту? <a href="/register">Зареєструватись</a>
      </p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertEl = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');

    const updaters = {};

    function setupFieldIcon(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);

      function update() {
        const focused = document.activeElement === input;
        const isInvalid = input.classList.contains('is-invalid');
        if (!focused && isInvalid) {
          icon.className = 'field-icon bi bi-exclamation-circle-fill visible';
          icon.style.color = '#dc3545';
        } else {
          icon.classList.remove('visible');
        }
      }

      input.addEventListener('focus', update);
      input.addEventListener('blur', update);
      updaters[inputId] = update;
    }

    function setupPasswordIcon(inputId, btnId, iconId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      const icon = document.getElementById(iconId);

      function update() {
        const focused = document.activeElement === input;
        const hasValue = input.value.length > 0;
        const isInvalid = input.classList.contains('is-invalid');

        if (focused && hasValue) {
          btn.classList.add('visible');
          btn.style.color = '#6c757d';
          btn.style.pointerEvents = 'auto';
          icon.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
        } else if (!focused && isInvalid) {
          btn.classList.add('visible');
          btn.style.color = '#dc3545';
          btn.style.pointerEvents = 'none';
          icon.className = 'bi bi-exclamation-circle-fill';
        } else {
          btn.classList.remove('visible');
        }
      }

      input.addEventListener('input', update);
      input.addEventListener('focus', update);
      input.addEventListener('blur', update);

      btn.addEventListener('mousedown', (e) => e.preventDefault());
      btn.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        update();
      });

      updaters[inputId] = update;
    }

    setupFieldIcon('email', 'emailIcon');
    setupPasswordIcon('password', 'passwordBtn', 'passwordIcon');

    function showError(msg) {
      alertEl.className = 'alert alert-danger';
      alertEl.textContent = msg;
    }

    function setInvalid(inputId, message) {
      const input = document.getElementById(inputId);
      input.classList.add('is-invalid');
      const container = input.closest('.mb-3, .mb-4');
      const feedback = container && container.querySelector('.invalid-feedback');
      if (feedback) {
        if (message) feedback.textContent = message;
        feedback.style.display = 'block';
      }
      if (updaters[inputId]) updaters[inputId]();
    }

    function clearInvalid() {
      document.querySelectorAll('.is-invalid').forEach(el => {
        el.classList.remove('is-invalid');
        if (updaters[el.id]) updaters[el.id]();
      });
      document.querySelectorAll('.invalid-feedback').forEach(el => el.style.display = '');
      alertEl.className = 'alert d-none';
    }

    ['email', 'password'].forEach(id => {
      document.getElementById(id).addEventListener('input', clearInvalid);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearInvalid();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      let hasEmpty = false;
      if (!email)    { setInvalid('email');    hasEmpty = true; }
      if (!password) { setInvalid('password'); hasEmpty = true; }
      if (hasEmpty) {
        showError('Будь ласка, заповніть усі поля');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Вхід...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          setInvalid('email');
          setInvalid('password');
          showError('Неправильний email або пароль');
          return;
        }

        window.location.href = '/dashboard';

      } catch {
        showError('Помилка з\'єднання з сервером');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Увійти';
      }
    });
  </script>
</body>
</html>

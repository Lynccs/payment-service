<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Транзакції — Finio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/static/css/transactions.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet"/>
</head>
<body>

  <!-- Navbar -->
  <nav class="finio-nav">
    <a class="finio-brand" href="/dashboard">
      <i class="bi bi-wallet2"></i>Finio
    </a>
    <div class="d-flex align-items-center gap-3 me-auto ms-4">
      <a href="/dashboard" class="nav-link-item" id="navDashboard">Дашборд</a>
      <a href="/transactions" class="nav-link-item" id="navTransactions">Транзакції</a>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span class="nav-user-email" id="userEmail"></span>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm">
        <i class="bi bi-box-arrow-right me-1"></i>Вийти
      </button>
    </div>
  </nav>

  <main class="container-xl px-3 px-md-4 py-4">

    <!-- Page header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="fw-semibold mb-0">Транзакції</h5>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary btn-sm px-3" id="exportCsvBtn">
          <i class="bi bi-download me-1"></i>Експорт CSV
        </button>
        <button class="btn btn-primary btn-sm px-3" data-bs-toggle="modal" data-bs-target="#txModal">
          <i class="bi bi-plus-lg me-1"></i>Додати транзакцію
        </button>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar d-flex flex-wrap align-items-center gap-2 mb-4 py-2 px-3">

      <!-- Date presets -->
      <div class="btn-group" role="group">
        <button class="btn btn-sm preset-btn" data-preset="week">Тиждень</button>
        <button class="btn btn-sm preset-btn active" data-preset="month">Місяць</button>
        <button class="btn btn-sm preset-btn" data-preset="3months">3 місяці</button>
        <button class="btn btn-sm preset-btn" data-preset="year">Рік</button>
      </div>

      <!-- Custom date range -->
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-calendar-range text-muted" style="font-size:.85rem"></i>
        <input id="datepicker" type="text" class="form-control form-control-sm date-input"
               placeholder="Кастомний діапазон" readonly/>
      </div>

      <!-- Right-side filters -->
      <div class="d-flex align-items-center gap-2 ms-auto flex-wrap">

        <!-- Category filter -->
        <select id="catFilter" class="form-select form-select-sm filter-select">
          <option value="">Всі категорії</option>
        </select>

        <!-- Type filter -->
        <select id="typeFilter" class="form-select form-select-sm filter-select">
          <option value="">Всі типи</option>
          <option value="income">Дохід</option>
          <option value="expense">Витрата</option>
        </select>

        <!-- Method filter -->
        <select id="methodFilter" class="form-select form-select-sm filter-select">
          <option value="">Тип платежу</option>
        </select>

      </div>

      <!-- Search -->
      <div class="input-group input-group-sm search-group">
        <span class="input-group-text border-end-0"><i class="bi bi-search"></i></span>
        <input id="searchInput" type="text" class="form-control border-start-0"
               placeholder="Пошук по опису"/>
      </div>

    </div>

    <!-- Transaction list -->
    <div id="txList">
      <div class="text-muted small text-center py-5">Завантаження...</div>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="d-flex justify-content-center mt-4"></div>

  </main>

  <!-- Add transaction modal -->
  <div class="modal fade" id="txModal" tabindex="-1" aria-labelledby="txModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h6 class="modal-title fw-semibold" id="txModalLabel">Нова транзакція</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
        </div>

        <div class="modal-body">
          <div id="txAlert" class="alert d-none mb-3" role="alert"></div>

          <form id="txForm" novalidate>

            <div class="mb-3">
              <div class="btn-group w-100" role="group">
                <input type="radio" class="btn-check" name="txType" id="typeExpense" value="false" checked/>
                <label class="btn btn-outline-danger" for="typeExpense">
                  <i class="bi bi-arrow-up-circle me-1"></i>Витрата
                </label>
                <input type="radio" class="btn-check" name="txType" id="typeIncome" value="true"/>
                <label class="btn btn-outline-success" for="typeIncome">
                  <i class="bi bi-arrow-down-circle me-1"></i>Дохід
                </label>
              </div>
            </div>

            <div class="mb-3">
              <label for="txAmount" class="form-label">Сума (₴)</label>
              <input type="number" class="form-control" id="txAmount"
                     min="0.01" step="10" placeholder="0.00"/>
              <div class="invalid-feedback">Введіть коректну суму</div>
            </div>

            <div class="mb-3">
              <label for="txCategory" class="form-label">Категорія</label>
              <select id="txCategory"></select>
              <div class="invalid-feedback">Оберіть категорію</div>
            </div>

            <div class="mb-3">
              <label for="txMethod" class="form-label">Тип платежу</label>
              <select id="txMethod"></select>
              <div class="invalid-feedback">Оберіть тип платежу</div>
            </div>

            <div class="mb-3">
              <label for="txDesc" class="form-label">
                Опис <small class="text-muted">(необов'язково)</small>
              </label>
              <input type="text" class="form-control" id="txDesc"
                     placeholder="Наприклад: обід у кафе"/>
            </div>

            <div class="mb-1">
              <label for="txDate" class="form-label">Дата</label>
              <div class="input-group">
                <span class="input-group-text modal-date-icon"><i class="bi bi-calendar3"></i></span>
                <input type="text" class="form-control" id="txDate" placeholder="ДД.ММ.РРРР" readonly/>
                <div class="invalid-feedback">Оберіть дату</div>
              </div>
            </div>

          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Скасувати</button>
          <button type="button" class="btn btn-primary" id="txSubmit">
            Додати
            <span id="txSpinner" class="spinner-border spinner-border-sm d-none ms-1"></span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center py-4 px-4">
          <div class="mb-3">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:2rem"></i>
          </div>
          <p class="mb-1 fw-semibold">Ви впевнені?</p>
          <p class="text-muted small mb-0">Цю дію не можна скасувати</p>
        </div>
        <div class="modal-footer justify-content-center border-0 pt-0 pb-4 gap-2">
          <button type="button" class="btn btn-light btn-sm px-4" data-bs-dismiss="modal">Скасувати</button>
          <button type="button" class="btn btn-danger btn-sm px-4" id="confirmDelete">Видалити</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/litepicker/dist/litepicker.js"></script>
  <script>
    'use strict';

    /* ── state ───────────────────────────────────── */

    const S = { preset: 'month', dateFrom: null, dateTo: null,
                category: '', type: '', method: '', search: '', page: 1, limit: 10 };

    let picker, pickerModal, tsCategory, tsMethod;
    let deleteTxID = null;
    let editTxID   = null;
    let searchTimer;

    /* ── helpers ─────────────────────────────────── */

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmt(n) {
      return '₴ ' + Number(n).toLocaleString('uk-UA', {
        minimumFractionDigits: 2, maximumFractionDigits: 2,
      });
    }

    function fmtDay(str) {
      return new Date(str).toLocaleDateString('uk-UA',
        { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function buildParams() {
      const p = new URLSearchParams();
      if (S.dateFrom) {
        p.set('date_from', S.dateFrom);
        p.set('date_to',   S.dateTo);
      } else {
        p.set('preset', S.preset);
      }
      if (S.category) p.set('category', S.category);
      if (S.type)     p.set('type', S.type);
      if (S.method)   p.set('method', S.method);
      if (S.search)   p.set('search', S.search);
      p.set('page',  S.page);
      p.set('limit', S.limit);
      return p.toString();
    }

    function buildExportParams() {
      const p = new URLSearchParams();
      if (S.dateFrom) {
        p.set('date_from', S.dateFrom);
        p.set('date_to',   S.dateTo);
      } else {
        p.set('preset', S.preset);
      }
      if (S.category) p.set('category', S.category);
      if (S.type)     p.set('type', S.type);
      if (S.method)   p.set('method', S.method);
      if (S.search)   p.set('search', S.search);
      return p.toString();
    }

    /* ── init ────────────────────────────────────── */

    async function init() {
      try {
        const res = await fetch('/api/users/me');
        if (res.status === 401) { location.href = '/login'; return; }
        const user = await res.json();
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('navTransactions').classList.add('active');
      } catch {
        location.href = '/login';
        return;
      }

      initPicker();
      initPresetBtns();
      initFilterDropdowns();
      initSearch();
      initLogout();
      initExportCsv();
      initAddModal();
      initEditButton();
      initDeleteModal();

      await Promise.all([loadFilterData(), loadTransactions()]);
    }

    /* ── litepicker ──────────────────────────────── */

    function initPicker() {
      picker = new Litepicker({
        element: document.getElementById('datepicker'),
        singleMode: false,
        format: 'DD.MM.YYYY',
        numberOfMonths: 2,
        numberOfColumns: 2,
        lang: 'uk-UA',
        resetButton: false,
      });
      picker.on('selected', function(d1, d2) {
        S.dateFrom = d1.format('YYYY-MM-DD');
        S.dateTo   = d2.format('YYYY-MM-DD');
        S.preset   = null;
        document.querySelectorAll('.preset-btn').forEach(function(b) { b.classList.remove('active'); });
        S.page = 1;
        loadTransactions();
      });
    }

    /* ── preset buttons ──────────────────────────── */

    function initPresetBtns() {
      document.querySelectorAll('.preset-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.preset-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          S.preset   = btn.dataset.preset;
          S.dateFrom = null;
          S.dateTo   = null;
          picker.clearSelection();
          document.getElementById('datepicker').value = '';
          S.page = 1;
          loadTransactions();
        });
      });
    }

    /* ── filter dropdowns ────────────────────────── */

    function initFilterDropdowns() {
      document.getElementById('catFilter').addEventListener('change', function() {
        S.category = this.value; S.page = 1; loadTransactions();
      });
      document.getElementById('typeFilter').addEventListener('change', function() {
        S.type = this.value; S.page = 1; loadTransactions();
      });
      document.getElementById('methodFilter').addEventListener('change', function() {
        S.method = this.value; S.page = 1; loadTransactions();
      });
    }

    /* ── search ──────────────────────────────────── */

    function initSearch() {
      document.getElementById('searchInput').addEventListener('input', function() {
        const val = this.value.trim();
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
          S.search = val; S.page = 1; loadTransactions();
        }, 400);
      });
    }

    /* ── export csv ─────────────────────────────── */

    function initExportCsv() {
      document.getElementById('exportCsvBtn').addEventListener('click', function() {
        window.location.href = '/api/transactions/export?' + buildExportParams();
      });
    }

    /* ── logout ──────────────────────────────────── */

    function initLogout() {
      document.getElementById('logoutBtn').addEventListener('click', async function() {
        await fetch('/api/auth/logout', { method: 'POST' }).catch(function() {});
        location.href = '/login';
      });
    }

    /* ── populate filter selects ─────────────────── */

    async function loadFilterData() {
      try {
        const [catIncome, catExpense, methods] = await Promise.all([
          fetch('/api/payment-categories?is_income=true').then(function(r) { return r.json(); }),
          fetch('/api/payment-categories?is_income=false').then(function(r) { return r.json(); }),
          fetch('/api/payment-methods').then(function(r) { return r.json(); }),
        ]);

        const catSel = document.getElementById('catFilter');

        if (catIncome && catIncome.length) {
          const g = document.createElement('optgroup');
          g.label = 'Доходи';
          catIncome.forEach(function(c) {
            g.appendChild(new Option((c.icon ? c.icon + ' ' : '') + c.name, c.id));
          });
          catSel.appendChild(g);
        }
        if (catExpense && catExpense.length) {
          const g = document.createElement('optgroup');
          g.label = 'Витрати';
          catExpense.forEach(function(c) {
            g.appendChild(new Option((c.icon ? c.icon + ' ' : '') + c.name, c.id));
          });
          catSel.appendChild(g);
        }

        const methSel = document.getElementById('methodFilter');
        (methods || []).forEach(function(m) {
          methSel.appendChild(new Option(m.name, m.id));
        });
      } catch(e) {
        console.error('loadFilterData:', e);
      }
    }

    /* ── load & render transactions ──────────────── */

    async function loadTransactions() {
      const el = document.getElementById('txList');
      el.innerHTML = '<div class="text-muted small text-center py-5">Завантаження...</div>';
      document.getElementById('pagination').innerHTML = '';

      try {
        const res = await fetch('/api/transactions?' + buildParams());
        if (!res.ok) throw new Error('http ' + res.status);
        const result = await res.json();

        renderGroups(result.data || []);
        renderPagination(result.total || 0, result.page || 1, result.limit || S.limit);
      } catch(e) {
        console.error('loadTransactions:', e);
        el.innerHTML = '<div class="text-muted small text-center py-5">Помилка завантаження</div>';
      }
    }

    function renderGroups(txs) {
      const el = document.getElementById('txList');
      if (!txs.length) {
        el.innerHTML = '<div class="text-muted small text-center py-5">Транзакцій не знайдено</div>';
        return;
      }

      const groups = {};
      const order  = [];
      txs.forEach(function(t) {
        const key = t.transaction_date.slice(0, 10);
        if (!groups[key]) {
          groups[key] = { label: fmtDay(t.transaction_date), txs: [], net: 0 };
          order.push(key);
        }
        groups[key].txs.push(t);
        groups[key].net += t.is_income ? t.amount : -t.amount;
      });

      el.innerHTML = order.map(function(key) {
        const g   = groups[key];
        const net = g.net;
        let netCls, netStr;
        if (net > 0) {
          netCls = 'tx-net-positive';
          netStr = '+' + fmt(net);
        } else if (net < 0) {
          netCls = 'tx-net-negative';
          netStr = '−' + fmt(-net);
        } else {
          netCls = 'tx-net-zero';
          netStr = fmt(0);
        }

        const rows = g.txs.map(function(t) {
          const isIncome = t.is_income;
          const amtCls   = isIncome ? 'tx-amount-income' : 'tx-amount-expense';
          const icon     = isIncome ? 'bi-arrow-down-circle-fill' : 'bi-arrow-up-circle-fill';
          const sign     = isIncome ? '+' : '−';
          const typeLbl  = isIncome ? 'Дохід' : 'Витрата';
          const typeCls  = isIncome ? 'income' : 'expense';
          const catIcon  = t.category_icon ? esc(t.category_icon) + ' ' : '';
          const cat      = esc(t.category_name || '—');
          const method   = esc(t.method_name   || '');
          const desc     = esc(t.description   || '');

          const editData = JSON.stringify({
            id: t.id, is_income: t.is_income, amount: t.amount,
            category_id: t.category_id || null,
            payment_method_id: t.payment_method_id || null,
            description: t.description || '',
            transaction_date: t.transaction_date,
          }).replace(/'/g, '&#39;');

          return '<tr>'
            + '<td class="col-cat">' + catIcon + cat + '</td>'
            + '<td class="col-type"><span class="type-badge ' + typeCls + '"><i class="bi ' + icon + ' me-1"></i>' + typeLbl + '</span></td>'
            + '<td class="col-method">' + (method ? method : '<span class="text-muted">—</span>') + '</td>'
            + '<td class="col-desc">' + (desc ? '<span title="' + desc + '">' + desc + '</span>' : '') + '</td>'
            + '<td class="col-amount"><span class="' + amtCls + '">'
            +   sign + fmt(t.amount)
            + '</span></td>'
            + '<td class="col-actions">'
            +   '<button class="btn-edit" data-edit=\'' + editData + '\' title="Редагувати">'
            +     '<i class="bi bi-pencil"></i>'
            +   '</button>'
            +   '<button class="btn-del" data-delete-id="' + t.id + '" title="Видалити">'
            +     '<i class="bi bi-trash3"></i>'
            +   '</button>'
            + '</td>'
            + '</tr>';
        }).join('');

        return '<div class="tx-group mb-3">'
          + '<div class="tx-group-header">'
          +   '<span class="tx-group-date">' + esc(g.label) + '</span>'
          +   '<span class="tx-group-net ' + netCls + '">' + netStr + '</span>'
          + '</div>'
          + '<div class="table-responsive">'
          +   '<table class="tx-table"><tbody>' + rows + '</tbody></table>'
          + '</div>'
          + '</div>';
      }).join('');
    }

    /* ── pagination ──────────────────────────────── */

    function renderPagination(total, page, limit) {
      const el         = document.getElementById('pagination');
      const totalPages = Math.ceil(total / limit);
      if (totalPages <= 1) { el.innerHTML = ''; return; }

      const start = Math.max(1, page - 2);
      const end   = Math.min(totalPages, page + 2);

      let html = '<nav><ul class="pagination pagination-sm mb-0">';

      html += '<li class="page-item' + (page <= 1 ? ' disabled' : '') + '">'
            + '<a class="page-link" href="#" data-p="' + (page - 1) + '">‹</a></li>';

      if (start > 1) {
        html += '<li class="page-item"><a class="page-link" href="#" data-p="1">1</a></li>';
        if (start > 2) html += '<li class="page-item disabled"><span class="page-link">&hellip;</span></li>';
      }

      for (let i = start; i <= end; i++) {
        html += '<li class="page-item' + (i === page ? ' active' : '') + '">'
              + '<a class="page-link" href="#" data-p="' + i + '">' + i + '</a></li>';
      }

      if (end < totalPages) {
        if (end < totalPages - 1) html += '<li class="page-item disabled"><span class="page-link">&hellip;</span></li>';
        html += '<li class="page-item"><a class="page-link" href="#" data-p="' + totalPages + '">' + totalPages + '</a></li>';
      }

      html += '<li class="page-item' + (page >= totalPages ? ' disabled' : '') + '">'
            + '<a class="page-link" href="#" data-p="' + (page + 1) + '">›</a></li>';

      html += '</ul></nav>';
      el.innerHTML = html;

      el.querySelectorAll('[data-p]').forEach(function(a) {
        a.addEventListener('click', function(e) {
          e.preventDefault();
          if (this.closest('.page-item').classList.contains('disabled')) return;
          S.page = parseInt(this.dataset.p, 10);
          loadTransactions();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    /* ── delete modal ────────────────────────────── */

    function initEditButton() {
      document.addEventListener('click', function(e) {
        const btn = e.target.closest('[data-edit]');
        if (!btn) return;
        const t = JSON.parse(btn.dataset.edit);
        openEditModal(t);
      });
    }

    async function openEditModal(t) {
      editTxID = t.id;

      const modal = document.getElementById('txModal');
      modal.querySelector('#txModalLabel').textContent = 'Редагувати транзакцію';
      document.getElementById('txSubmit').childNodes[0].textContent = 'Зберегти ';

      document.querySelectorAll('[name="txType"]').forEach(function(r) {
        r.checked = (r.value === 'true') === t.is_income;
      });
      document.getElementById('txAmount').value = t.amount;

      const dateObj = new Date(t.transaction_date);
      const pad = function(n) { return String(n).padStart(2, '0'); };
      const formatted = pad(dateObj.getDate()) + '.' + pad(dateObj.getMonth() + 1) + '.' + dateObj.getFullYear();

      await Promise.all([
        loadModalCategories(t.is_income),
        loadModalMethods(),
      ]);

      if (t.category_id) tsCategory.setValue(String(t.category_id), true);
      if (t.payment_method_id) tsMethod.setValue(String(t.payment_method_id), true);

      document.getElementById('txDesc').value = t.description || '';
      pickerModal.setDate(formatted, true);

      new bootstrap.Modal(modal).show();
    }

    function initDeleteModal() {
      document.addEventListener('click', function(e) {
        const btn = e.target.closest('[data-delete-id]');
        if (!btn) return;
        deleteTxID = parseInt(btn.dataset.deleteId, 10);
        new bootstrap.Modal(document.getElementById('deleteModal')).show();
      });

      document.getElementById('confirmDelete').addEventListener('click', async function() {
        if (!deleteTxID) return;
        const btn = this;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        try {
          const res = await fetch('/api/transactions/' + deleteTxID, { method: 'DELETE' });
          if (!res.ok && res.status !== 204) throw new Error('delete failed');
          bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
          deleteTxID = null;
          await loadTransactions();
        } catch {
          btn.disabled = false;
          btn.textContent = 'Видалити';
        }
      });

      document.getElementById('deleteModal').addEventListener('hidden.bs.modal', function() {
        const btn = document.getElementById('confirmDelete');
        btn.disabled = false;
        btn.textContent = 'Видалити';
        deleteTxID = null;
      });
    }

    /* ── add transaction modal ───────────────────── */

    function initAddModal() {
      const modal = document.getElementById('txModal');

      tsCategory = new TomSelect('#txCategory', {
        create: false,
        maxOptions: null,
        placeholder: 'Обрати',
        allowEmptyOption: false,
        onFocus: function() { tsCategory.wrapper.classList.remove('is-invalid'); },
        render: {
          optgroup_header: function(data, escape) {
            return '<div class="ts-group-header"><span>' + escape(data.label) + '</span></div>';
          },
        },
      });
      tsCategory.control_input.addEventListener('beforeinput', function(e) {
        if (!e.data) return;
        if (!/^[\p{L}\s,.?!:]+$/u.test(e.data)) e.preventDefault();
      });

      tsMethod = new TomSelect('#txMethod', {
        create: false,
        placeholder: 'Обрати',
        allowEmptyOption: false,
        onFocus: function() { tsMethod.wrapper.classList.remove('is-invalid'); },
      });

      pickerModal = new Litepicker({
        element: document.getElementById('txDate'),
        singleMode: true,
        format: 'DD.MM.YYYY',
        lang: 'uk-UA',
        numberOfMonths: 1,
        numberOfColumns: 1,
        resetButton: false,
        autoApply: true,
      });

      modal.addEventListener('show.bs.modal', function() {
        document.getElementById('txAlert').className = 'alert d-none';
        tsCategory.wrapper.classList.remove('is-invalid');
        tsMethod.wrapper.classList.remove('is-invalid');
        document.querySelectorAll('#txForm .is-invalid').forEach(function(el) {
          el.classList.remove('is-invalid');
        });
        if (!editTxID) pickerModal.setDate(new Date());
      });

      modal.addEventListener('hidden.bs.modal', function() {
        if (editTxID) {
          editTxID = null;
          modal.querySelector('#txModalLabel').textContent = 'Нова транзакція';
          document.getElementById('txSubmit').childNodes[0].textContent = 'Додати ';
          document.getElementById('txForm').reset();
          tsCategory.clear(true);
          tsMethod.clear(true);
        }
      });

      modal.addEventListener('shown.bs.modal', async function() {
        if (!editTxID) await Promise.all([loadModalCategories(false), loadModalMethods()]);
      });

      document.querySelectorAll('[name="txType"]').forEach(function(r) {
        r.addEventListener('change', function(e) {
          loadModalCategories(e.target.value === 'true');
        });
      });

      document.getElementById('txSubmit').addEventListener('click', submitTransaction);
    }

    async function loadModalCategories(isIncome) {
      tsCategory.disable();
      tsCategory.clear(true);
      tsCategory.clearOptions();
      try {
        const res  = await fetch('/api/payment-categories?is_income=' + isIncome);
        const cats = await res.json();
        const groups = {};
        cats.forEach(function(c) {
          if (!groups[c.group_name]) groups[c.group_name] = [];
          groups[c.group_name].push(c);
        });
        Object.keys(groups).forEach(function(groupName) {
          tsCategory.addOptionGroup(groupName, { label: groupName });
          groups[groupName].forEach(function(c) {
            const prefix = c.icon ? c.icon + ' ' : '';
            tsCategory.addOption({ value: String(c.id), text: prefix + c.name, optgroup: groupName });
          });
        });
      } catch(e) {
        console.error('loadModalCategories:', e);
      }
      tsCategory.enable();
    }

    async function loadModalMethods() {
      tsMethod.disable();
      tsMethod.clear(true);
      tsMethod.clearOptions();
      try {
        const res     = await fetch('/api/payment-methods');
        const methods = await res.json();
        methods.forEach(function(m) {
          tsMethod.addOption({ value: String(m.id), text: m.name });
        });
      } catch(e) {
        console.error('loadModalMethods:', e);
      }
      tsMethod.enable();
    }

    async function submitTransaction() {
      const alertEl = document.getElementById('txAlert');
      alertEl.className = 'alert d-none';
      document.querySelectorAll('#txForm .is-invalid').forEach(function(el) {
        el.classList.remove('is-invalid');
      });
      tsCategory.wrapper.classList.remove('is-invalid');
      tsMethod.wrapper.classList.remove('is-invalid');

      const isIncome  = document.querySelector('[name="txType"]:checked').value === 'true';
      const amountVal = document.getElementById('txAmount').value;
      const catVal    = tsCategory.getValue();
      const methVal   = tsMethod.getValue();
      const descVal   = document.getElementById('txDesc').value.trim();
      const dateVal   = pickerModal.getDate();

      const amount = parseFloat(amountVal);
      let valid = true;

      if (!amountVal || isNaN(amount) || amount <= 0) {
        document.getElementById('txAmount').classList.add('is-invalid');
        valid = false;
      }
      if (!catVal) {
        tsCategory.wrapper.classList.add('is-invalid');
        valid = false;
      }
      if (!methVal) {
        tsMethod.wrapper.classList.add('is-invalid');
        valid = false;
      }
      if (!dateVal) {
        document.getElementById('txDate').classList.add('is-invalid');
        valid = false;
      }
      if (!valid) return;

      const btn     = document.getElementById('txSubmit');
      const spinner = document.getElementById('txSpinner');
      btn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        const txDate = new Date(dateVal.format('YYYY-MM-DD') + 'T12:00:00');
        const body = JSON.stringify({
          is_income:         isIncome,
          amount:            amount,
          category_id:       parseInt(catVal, 10),
          payment_method_id: parseInt(methVal, 10),
          description:       descVal,
          transaction_date:  txDate.toISOString(),
        });

        const url    = editTxID ? '/api/transactions/' + editTxID : '/api/transactions';
        const method = editTxID ? 'PUT' : 'POST';
        const res    = await fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: body });

        if (!res.ok) {
          const err = await res.json().catch(function() { return {}; });
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = err.error || 'Помилка при збереженні транзакції';
          return;
        }

        bootstrap.Modal.getInstance(document.getElementById('txModal')).hide();
        await loadTransactions();
      } catch {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = "Помилка з'єднання з сервером";
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    }

    init();
  </script>
</body>
</html>
